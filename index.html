<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berk'e Sor</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent-glow: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Arka Plan Glow Efektleri */
        .ambient-light {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Ana Kart (Glassmorphism) */
        .card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 4rem 3rem;
            border-radius: 28px;
            text-align: center;
            max-width: 640px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* Tipografi */
        .subtitle {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
        }

        .title {
            font-size: 3.25rem;
            font-weight: 600;
            line-height: 1.08;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2.5rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
        }

        /* Apple Tarzı Buton */
        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.9rem 2.2rem;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #000000;
            background-color: #ffffff;
            border: none;
            border-radius: 980px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.6s;
        }

        .cta-button:hover {
            background-color: #f5f5f7;
            transform: scale(1.04);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        /* Animasyonlar */
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobil Uyumluluk */
        @media (max-width: 640px) {
            .card {
                padding: 3rem 1.5rem;
            }
            .subtitle {
                font-size: 1.1rem;
            }
            .title {
                font-size: 2.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <main class="card" id="card">
        <p class="subtitle">Aradığını bulamadın mı?</p>
        <h1 class="title">Berk’e sor, o bilir.</h1>
    </main>

    <script>
        // Mouse Hareketiyle Hafif 3D Parallax Efekti
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Mouse Karttan Çıkınca Sıfırlama
        document.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });

        function handleButtonClick() {
            const button = document.querySelector('.cta-button');
            button.style.transform = 'scale(0.95)';
            setTimeout(() => {
                button.style.transform = 'scale(1)';
                alert("Berk'e yönlendiriliyorsunuz...");
            }, 150);
        }
    </script>
</body>
</html>
