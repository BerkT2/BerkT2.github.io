<!doctype html>
<html lang="en">
<head>
<title>Hearthfield</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#121417">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one screen. The living map on the left (on top on phones), the steward's ledger of orders beside it. */
:root{
  --bg:#121417; --panel:#1a1d21; --raise:#22262b; --line:#2e333a;
  --fg:#e7e0d3; --muted:#958f84; --lamp:#e9a54a;
  --good:#86b46e; --bad:#d8664c; --frost:#94bcd8;
  --display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --body:"Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.35;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;padding-block:10px;padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px))}
#stage{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#1c2430}
#cv{display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
#mini{position:absolute;top:8px;right:8px;width:160px;height:120px;border:1px solid rgba(233,165,74,.45);border-radius:3px;background:#222;cursor:pointer;touch-action:none;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.mapbtns{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.mapbtns .btn{width:36px;height:36px;padding:0;font-family:var(--mono);font-size:16px;background:rgba(26,29,33,.88)}
#placeBar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(20,22,26,.94);border:1px solid var(--lamp);border-radius:6px;padding:8px 10px;max-width:calc(100% - 70px);box-sizing:border-box}
#placeTxt{font-size:13px;min-width:0;flex:1;line-height:1.25}
#panel{min-width:0;min-height:0;display:flex;flex-direction:column;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:13px 14px 10px;box-sizing:border-box;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow.winter{color:var(--frost)}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1;letter-spacing:.02em}
.phase{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#phaseTxt{font-family:var(--mono);font-size:12px;color:var(--lamp)}
.seg{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.dusk{height:4px;background:var(--raise);border-radius:2px;overflow:hidden}
.dusk i{display:block;height:100%;background:var(--lamp)}
.scout{font-size:13px;color:var(--muted);border-left:2px solid var(--bad);padding-left:8px}
.scout b{color:var(--fg);font-weight:500}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.rc{background:var(--raise);border-radius:3px;padding:5px 8px;min-width:0}
.rc .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rc .v{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc .v small{color:var(--muted);font-size:11px}
.rc .d{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)} .zero{color:var(--muted)}
.popline{display:flex;flex-direction:column;gap:5px}
.popline .top{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.bar{height:6px;background:var(--raise);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lamp);transition:width .3s}
.warn{color:var(--bad);font-size:12.5px}
.warn:empty{display:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;color:var(--muted);font:500 14px var(--body);padding:6px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--lamp)}
.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--lamp);outline-offset:1px}
.tabbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding-right:2px}
.note{font-size:12.5px;color:var(--muted)}
.sect{font-family:var(--display);font-size:17px;margin-top:6px}
.row{display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--raise);border-radius:3px}
.rmain{flex:1;min-width:0}
.rtitle{display:flex;gap:8px;align-items:baseline}
.rname{font-weight:700}
.rcount{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rdesc{font-size:12.5px;color:var(--muted)}
.rcost{font-family:var(--mono);font-size:11.5px;display:flex;flex-wrap:wrap;gap:0 8px}
.rcost:empty{display:none}
.rcost .short{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;vertical-align:1px}
.btn{background:#2a2f35;color:var(--fg);border:1px solid #3a4048;border-radius:3px;font:500 13px var(--body);padding:5px 10px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--lamp);color:#fff}
.btn:disabled{opacity:.38;cursor:default}
.btn.primary,.btn[aria-pressed="true"]{background:var(--lamp);color:#1a1206;border-color:var(--lamp)}
.btn.sq{width:30px;padding:5px 0;font-family:var(--mono)}
.btn.sm{padding:3px 8px;font-size:12px}
.jobbtns{display:flex;gap:4px}
.optrow{display:flex;flex-direction:column;gap:5px;padding:7px 8px;background:var(--raise);border-radius:3px}
.optrow .rdesc{min-height:2.6em}
#selBox{border-top:1px solid var(--line);padding-top:7px;display:flex;flex-direction:column;gap:4px}
.selhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.selname{font-family:var(--display);font-size:18px}
.selsub{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.selbody{font-size:12.5px;color:var(--muted)}
.selbody b{color:var(--fg);font-weight:500}
.selbtns{display:flex;gap:6px}
.log{border-top:1px solid var(--line);padding-top:6px;font-size:12.5px;display:flex;flex-direction:column;gap:2px;max-height:100px;overflow:hidden}
.log div{color:var(--muted)} .log div:first-child{color:var(--fg)}
.log .bad{color:var(--bad)} .log .good{color:var(--good)}
#modal{position:fixed;inset:0;background:rgba(8,9,11,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;max-width:580px;width:100%;max-height:calc(100% - 32px);overflow-y:auto;padding:22px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;-webkit-user-select:text;user-select:text}
.card h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;line-height:1.05;text-wrap:balance}
.card p{margin:0;max-width:62ch}
.card .opts{display:flex;flex-direction:column;gap:6px}
.card .opts .btn{text-align:left;padding:9px 12px;white-space:normal}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.keys kbd{font-family:var(--mono);font-size:12px;background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:1px 6px;justify-self:start}
.stats{display:flex;gap:18px;font-family:var(--mono);font-size:13px;flex-wrap:wrap}
.stats b{display:block;font-size:22px;color:var(--lamp)}
@media (pointer:coarse){
  .btn{min-height:36px;padding:7px 12px}
  .btn.sm{min-height:32px;padding:5px 10px}
  .btn.sq{width:40px}
  .tab{padding:10px 12px}
  #mini{width:120px;height:90px}
}
@media (max-width:900px) and (orientation:portrait){
  .ph{flex-wrap:wrap;align-items:flex-start}
  .phase{flex-direction:row-reverse;flex-wrap:wrap;width:100%;justify-content:space-between;align-items:center;gap:6px}
  .phase .seg{justify-content:flex-start}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,56fr) minmax(0,44fr);gap:6px;padding-block:max(6px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-bottom,0px));padding-inline:6px}
  #panel{overflow-y:auto;padding:10px;gap:7px}
  .tabbody{overflow:visible;flex:none}
  h1{font-size:24px}
  .log{display:none}
  .res{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-height:540px) and (orientation:landscape){
  #app{grid-template-columns:minmax(0,1fr) 310px;gap:6px;padding-block:6px}
  #panel{overflow-y:auto;padding:8px 10px;gap:6px}
  .tabbody{overflow:visible;flex:none}
  h1{font-size:22px}
  .log{display:none}
  .scout{font-size:12px}
  #mini{width:110px;height:83px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div id="app">
  <main id="stage">
    <canvas id="cv" aria-label="Your settlement and the land around it"></canvas>
    <canvas id="mini" aria-label="Map overview. Tap to move the view."></canvas>
    <div class="mapbtns"><button class="btn" id="zIn" aria-label="Zoom in">+</button><button class="btn" id="zOut" aria-label="Zoom out">−</button><button class="btn" id="zHome" aria-label="Center on the town hall">⌂</button></div>
    <div id="placeBar" hidden><span id="placeTxt"></span><button class="btn primary" id="pbOk">Place</button><button class="btn" id="pbNo">Cancel</button></div>
  </main>
  <aside id="panel">
    <header class="ph">
      <div><div class="eyebrow" id="season">Spring</div><h1 id="dayTitle">Day 1</h1></div>
      <div class="phase"><span id="phaseTxt"></span>
        <div class="seg" id="speeds">
          <button class="btn sm" data-sp="0">Pause</button><button class="btn sm" data-sp="1">1×</button><button class="btn sm" data-sp="2">2×</button><button class="btn sm" data-sp="3">3×</button>
        </div>
        <div class="seg"><button class="btn sm" id="btnSound">Sound</button><button class="btn sm" id="btnMusic">Music</button><button class="btn sm" id="btnFull">Fullscreen</button></div>
      </div>
    </header>
    <div class="dusk"><i id="duskBar"></i></div>
    <div class="scout" id="scout"></div>
    <section class="res" id="res"></section>
    <section class="popline">
      <div class="top"><span id="popTxt"></span><span id="moraleTxt"></span></div>
      <div class="bar"><i id="moraleBar"></i></div>
      <div class="warn" id="warn"></div>
    </section>
    <section id="selBox" hidden>
      <div class="selhead"><span class="selname" id="selName"></span><span class="selsub" id="selSub"></span></div>
      <div class="selbody" id="selBody"></div>
      <div class="selbtns"><button class="btn sm" id="selFollow" hidden>Follow</button><button class="btn sm" id="selBtn">Demolish</button></div>
    </section>
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="jobs" aria-selected="true">Jobs</button>
      <button class="tab" data-tab="build" aria-selected="false">Build</button>
      <button class="tab" data-tab="orders" aria-selected="false">Orders</button>
      <button class="tab" data-tab="lore" aria-selected="false">Research</button>
    </nav>
    <section class="tabbody" id="tab-jobs"></section>
    <section class="tabbody" id="tab-build" hidden></section>
    <section class="tabbody" id="tab-orders" hidden></section>
    <section class="tabbody" id="tab-lore" hidden></section>
    <section class="log" id="log" aria-live="polite"></section>
  </aside>
</div>
<div id="modal" hidden><div class="card" id="modalCard"></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>n>=10000?(n/1000).toFixed(1)+'k':Math.floor(n).toString();
const TAU=Math.PI*2;
const TS=20,GW=96,GH=72,W=GW*TS,H=GH*TS,DAY=100,WALK=40;
const SEASONS=['Spring','Summer','Autumn','Winter'];

/* ---------- definitions ---------- */
const RES=[['food','Food'],['wood','Wood'],['stone','Stone'],['iron','Iron'],['arms','Arms'],['lore','Lore']];
const RESN={food:'food',wood:'wood',stone:'stone',iron:'iron',arms:'arms',lore:'lore',mat:'materials'};
const RESCOL={food:'#e0c050',wood:'#9a6a3a',stone:'#b8b8b0',iron:'#7f8a96',arms:'#d6743c',mat:'#c79a5c'};
const TILEN={t:'trees',r:'rock',o:'iron ore'};
const BD={
  hall:{name:'Town Hall',w:3,h:3,hp:600,cost:{},store:true,desc:'Stores everything and holds 4 beds. Its archers shoot nearby raiders. If it falls, the settlement is lost.'},
  house:{name:'House',w:2,h:2,hp:120,cost:{wood:20},desc:'4 beds. Villagers sleep here at night.'},
  field:{name:'Field',w:3,h:3,hp:80,cost:{wood:10},job:'farmer',slots:2,desc:'9 plots for 2 farmers to sow and harvest. No growth in winter.'},
  lumber:{name:"Woodcutter's Hut",w:2,h:2,hp:100,cost:{wood:15},job:'cutter',slots:3,reach:7,res:'t',desc:'3 woodcutters fell trees within reach.'},
  lodge:{name:"Hunter's Lodge",w:2,h:2,hp:100,cost:{wood:30},job:'hunter',slots:2,reach:18,desc:'2 hunters track deer nearby and carry back 10 food per kill.'},
  quarry:{name:'Quarry',w:2,h:2,hp:100,cost:{wood:25},job:'mason',slots:3,reach:6,res:'r',desc:'3 quarriers cut stone within reach.'},
  mine:{name:'Iron Mine',w:2,h:2,hp:120,cost:{wood:40,stone:20},job:'miner',slots:2,reach:5,res:'o',desc:'2 miners dig iron ore within reach.'},
  stockpile:{name:'Stockpile',w:2,h:2,hp:90,cost:{wood:15},store:true,desc:'Drop-off point. Workers carry goods to the nearest one. +100 storage.'},
  forge:{name:'Forge',w:2,h:2,hp:140,cost:{wood:30,stone:40},job:'smith',slots:2,desc:'2 smiths turn 1 iron and 1 wood into 1 arms.'},
  library:{name:'Library',w:2,h:2,hp:120,cost:{wood:50,stone:40},job:'scholar',slots:2,desc:'2 scholars write lore for research.'},
  barracks:{name:'Barracks',w:2,h:2,hp:220,cost:{wood:40,stone:30},desc:'+4 soldier posts. Soldiers drill here by day.'},
  tower:{name:'Watchtower',w:1,h:1,hp:220,cost:{wood:20,stone:30},desc:'At night an archer climbs it, shoots farther and cannot be reached.'},
  palisade:{name:'Palisade',w:1,h:1,hp:150,cost:{wood:4},wall:true,desc:'Drag across the map to build a line. Raiders must break through it. Your people pass through its gates.'},
  stonewall:{name:'Stone Wall',w:1,h:1,hp:420,cost:{stone:5},wall:true,desc:'Drag to build a line. Nearly three times as tough as a palisade.'},
  tavern:{name:'Tavern',w:2,h:2,hp:120,cost:{wood:50,stone:30},max:3,desc:'+8 morale.'},
};
const JOBS=[
  {k:'farmer',name:'Farmers',b:'field'},{k:'cutter',name:'Woodcutters',b:'lumber'},{k:'hunter',name:'Hunters',b:'lodge'},{k:'mason',name:'Quarriers',b:'quarry'},
  {k:'miner',name:'Miners',b:'mine'},{k:'smith',name:'Smiths',b:'forge'},{k:'scholar',name:'Scholars',b:'library'},
  {k:'builder',name:'Builders'},{k:'spear',name:'Spearmen'},{k:'archer',name:'Archers'}];
const JOBB={farmer:'field',cutter:'lumber',hunter:'lodge',mason:'quarry',miner:'mine',smith:'forge',scholar:'library'};
const JOBNAME={idle:'Idle',farmer:'Farmer',cutter:'Woodcutter',hunter:'Hunter',mason:'Quarrier',miner:'Miner',smith:'Smith',scholar:'Scholar',builder:'Builder',spear:'Spearman',archer:'Archer'};
const JOBCOL={idle:'#b9b2a5',farmer:'#d8c25a',cutter:'#7fae5a',hunter:'#8a6a3a',mason:'#a9b1ba',miner:'#6f7f92',smith:'#d6743c',scholar:'#8fa6e0',builder:'#d9a066',spear:'#4f7fc0',archer:'#4fb0b8'};
const TECH=[
  {k:'carts',name:'Handcarts',cost:30,desc:'Workers carry 8 instead of 5 per trip'},
  {k:'crop',name:'Crop Rotation',cost:30,desc:'Crops grow 25% faster and each harvest gives 7 food'},
  {k:'tools',name:'Iron Tools',cost:40,desc:'Woodcutters, quarriers and miners work 25% faster'},
  {k:'forestry',name:'Forestry',cost:35,desc:'Felled trees grow back in 80 seconds instead of 300'},
  {k:'masonry',name:'Masonry',cost:60,desc:'All buildings get 50% more HP'},
  {k:'drills',name:'Drill Sergeants',cost:50,desc:'Soldiers get 25% more HP'},
  {k:'bowyers',name:'Bowyers',cost:50,desc:'Archers deal 30% more damage and reach 30 further'},
  {k:'cellar',name:'Cold Frames',cost:60,desc:'Crops keep growing in winter at 40% speed'},
  {k:'medicine',name:'Field Medicine',cost:60,desc:'Soldiers heal during night fighting'},
  {k:'civic',name:'Civic Order',cost:70,desc:'+10 morale'},
];
const EN={
  raider:{name:'Raider',hp:26,spd:30,r:6,dmg:5,bd:5,cd:1,aggro:90,from:1,w:5,cost:1,col:'#b5483b',torch:true},
  wolf:{name:'Wolf',hp:18,spd:62,r:6,dmg:4,bd:1,cd:0.7,aggro:230,from:2,w:3,cost:1,col:'#948d80'},
  archer:{name:'Raider archer',hp:20,spd:28,r:6,dmg:5,bd:2,cd:1.7,range:85,aggro:130,from:3,w:2,cost:1.5,col:'#c7773f'},
  torch:{name:'Torchbearer',hp:22,spd:34,r:6,dmg:3,bd:14,cd:1,bonly:true,from:4,w:1.5,cost:2,col:'#e8963a',torch:true},
  brute:{name:'Brute',hp:120,spd:20,r:10,dmg:12,bd:16,cd:1.3,bonly:true,from:5,w:1.2,cost:4,col:'#86416b'},
  warlord:{name:'Warlord',hp:450,spd:18,r:14,dmg:18,bd:25,cd:1.2,aggro:70,from:99,w:0,cost:0,col:'#d9513a',torch:true},
};
const RATION={lean:{m:0.7,mo:-12,label:'Lean',desc:'Villagers eat 30% less. −12 morale.'},normal:{m:1,mo:0,label:'Normal',desc:'0.05 food per villager per second.'},generous:{m:1.3,mo:10,label:'Generous',desc:'Villagers eat 30% more. +10 morale.'}};
const HOURS={normal:{label:'Normal',desc:'Workers head home before dusk.'},long:{label:'Long',desc:'Workers stay out until nightfall. More work, −12 morale, and raiders may catch them outside.'}};
const STANCE={hold:{label:'Hold the flag',desc:'Soldiers fight only near the rally flag.'},defend:{label:'Defend',desc:'Soldiers go after raiders attacking buildings or villagers.'},hunt:{label:'Hunt',desc:'Soldiers chase every raider on the map.'}};
const RELIC=[
  {k:'settlers',name:'Hardy Settlers',base:3,desc:'+1 starting villager'},
  {k:'stores',name:'Old Stores',base:2,desc:'+30 starting food and wood'},
  {k:'craft',name:'Craft Lore',base:5,desc:'Everyone works 10% faster'},
  {k:'vets',name:'Veterans',base:4,desc:'Soldiers get 20% more HP and damage'},
  {k:'timber',name:'Seasoned Timber',base:3,desc:'Buildings get 20% more HP'},
];
const NAMES='Ada Bram Cora Dain Edda Finn Gwen Hale Ilse Jory Kett Lise Mara Nell Osric Pell Quin Rhea Sela Tam Ulla Vance Wren Yara Bryn Cael Dora Elm Fenn Greta Hugh Ivo Jessa Kai Lorn Mott Nia Orla Piet Roan Sib Tova Una Vik Willa Alder Berit Col Della Ewan Faye Gil Hanne Isa Jem Kira Leif Maud Ned Odo Petra Rolf Saga Tilde Ugo Vera Wyn Arn Bess Cid Dagny Eli Frey Gert Hild'.split(' ');

/* ---------- persistence ---------- */
const UPK={settlers:0,stores:0,craft:0,vets:0,timber:0};
function loadMeta(){
  let m=null;try{m=JSON.parse(localStorage.getItem('hearth_meta')||'null')}catch(e){}
  const d={relics:0,best:0,runs:0,up:Object.assign({},UPK)};
  if(m){Object.assign(d,m);d.up=Object.assign({},UPK,m.up||{})}
  return d;
}
const saveMeta=()=>{try{localStorage.setItem('hearth_meta',JSON.stringify(meta))}catch(e){}};
const ser=s=>JSON.stringify(Object.assign({},s,{enemies:[],shots:[],parts:[],floats:[]}),(k,v)=>k==='tg'||k==='tgt'?undefined:v);
function saveRun(){try{localStorage.setItem('hearth_run2',ser(S))}catch(e){}}
function loadRun(){try{return JSON.parse(localStorage.getItem('hearth_run2')||'null')}catch(e){return null}}

let meta=loadMeta(),S=null,paused=false,speed=1,modalOpen=false;

const HALLX=GW/2-2,HALLY=GH/2-2,HCX=(HALLX+1.5)*TS,HCY=(HALLY+1.5)*TS;
const idx=(x,y)=>y*GW+x;
function genMap(){
  const m=[];for(let i=0;i<GW*GH;i++)m.push({t:'g',a:0,b:null});
  const cx0=HALLX+1,cy0=HALLY+1;
  const far=(x,y,d)=>Math.hypot(x-cx0,y-cy0)>d;
  const blob=(cx,cy,r,t,a)=>{for(let y=Math.floor(cy-r-1);y<=cy+r+1;y++)for(let x=Math.floor(cx-r-1);x<=cx+r+1;x++){
    if(x<0||y<0||x>=GW||y>=GH||!far(x,y,5.2))continue;
    if(Math.hypot(x-cx,y-cy)<r+rnd(-0.7,0.5)){const c=m[idx(x,y)];if(c.t==='g'){c.t=t;c.a=a}}}};
  const at=(dmin,dmax)=>{const a=Math.random()*TAU,d=rnd(dmin,dmax);return[cx0+Math.cos(a)*d*1.25,cy0+Math.sin(a)*d]};
  let p=at(8,9);blob(p[0],p[1],3.4,'t',25);p=at(10,13);blob(p[0],p[1],3,'t',25);
  for(let i=0;i<36;i++){p=[rnd(0,GW),rnd(0,GH)];if(far(p[0],p[1],10))blob(p[0],p[1],rnd(2,5.5),'t',25)}
  for(let i=0;i<380;i++){const x=Math.floor(rnd(0,GW)),y=Math.floor(rnd(0,GH));if(far(x,y,6)&&m[idx(x,y)].t==='g'){m[idx(x,y)].t='t';m[idx(x,y)].a=25}}
  p=at(8,10);blob(p[0],p[1],1.8,'r',50);
  for(let i=0;i<9;i++){p=at(12,40);blob(p[0],p[1],rnd(1.2,2.4),'r',50)}
  for(let i=0;i<7;i++){p=at(14,40);blob(p[0],p[1],rnd(1,1.7),'o',35)}
  return m;
}

/* ---------- state helpers ---------- */

const getV=id=>S.v.find(v=>v.id===id);
const hallB=()=>S.b.find(b=>b.type==='hall');
const cen=b=>[(b.x+b.w/2)*TS,(b.y+b.h/2)*TS];
const doorOf=(b,v)=>[(b.x+b.w/2)*TS+(v?v.j:0),(b.y+b.h)*TS+3];
const built=t=>S.b.filter(b=>b.type===t&&b.built);
const countB=t=>S.b.filter(b=>b.type===t).length;

const isWinter=d=>((d??S.day)-1)%4===3;

const carryCap=()=>S.tech.carts?8:5;
const moraleMult=()=>(0.6+S.morale/100*0.6);

const maxB=t=>BD[t].hp*(S.tech.masonry?1.5:1)*(1+0.2*U().timber);
const solMult=()=>(1+0.25*S.armory)*(1+0.2*U().vets);
function maxHp(v){
  const hm=(S.tech.drills?1.25:1)*(1+0.2*S.armory)*(1+0.2*U().vets);
  return v.job==='spear'?60*hm:v.job==='archer'?40*hm:30;
}
const spearDmg=()=>9*solMult();
const archDmg=()=>7*solMult()*(S.tech.bowyers?1.3:1);
const archRange=()=>110+(S.tech.bowyers?30:0);
function cap(k){if(k==='lore')return Infinity;return 150+100*built('stockpile').length}
function bcost(t){const c=BD[t].cost,o={},n=BD[t].wall?0:countB(t);for(const k in c)o[k]=Math.ceil(c[k]*Math.pow(1.08,n));return o}
const afford=c=>Object.keys(c).every(k=>S.res[k]>=c[k]);
const armoryCost=()=>Math.ceil(8*Math.pow(1.6,S.armory));
const relicCost=r=>Math.ceil(r.base*Math.pow(1.6,meta.up[r.k]));
function addRes(k,n){

  S.bk.cur[k]=(S.bk.cur[k]||0)+got;return got;
}

function burst(x,y,col,n,k){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rnd(20,110);PARTS.push({k:k||'bit',x,y,z:rnd(2,8),vz:rnd(20,70),vx:Math.cos(a)*s,vy:Math.sin(a)*s*0.6,life:rnd(0.4,0.8),max:0.8,s:rnd(1.4,2.6),col})}}
function puff(x,y,n,col){for(let i=0;i<n;i++)PARTS.push({k:'dust',x:x+rnd(-4,4),y:y+rnd(-2,2),vx:rnd(-12,12),vy:rnd(-8,2),life:rnd(0.5,0.9),max:0.9,s:rnd(1.5,3),gs:5,col:col||'#b8a07a'})}
function sparks(x,y,n){for(let i=0;i<n;i++)PARTS.push({k:'spark',x,y,z:4,vz:rnd(30,90),vx:rnd(-40,40),vy:rnd(-20,20),life:rnd(0.3,0.6),max:0.6,s:1.2,col:'#ffd070',add:true})}
function blood(x,y,n){for(let i=0;i<n;i++)PARTS.push({k:'bit',x,y,z:6,vz:rnd(10,50),vx:rnd(-30,30),vy:rnd(-15,15),life:0.6,max:0.6,s:1.3,col:'#8a1a14'})}

/* ---------- villagers ---------- */
function mkVillager(x,y,job='idle'){
  const used=new Set(S.v.map(v=>v.name));
  const free=NAMES.filter(n=>!used.has(n));
  const name=free.length?pickOne(free):pickOne(NAMES)+' '+'II';
  const v={id:S.nid++,name,x,y,job,work:null,hp:30,home:null,inside:false,inT:false,carry:null,j:rnd(-7,7),timer:0,cd:0,status:'Idle'};
  v.hp=maxHp(v);S.v.push(v);return v;
}
function resetTask(v){v.prey=null;v.carc=null;v.plot=null;v.tile=null;v.site=null;v.fetching=false;v.timer=0;v.tg=null;v.rep=null;v.wx=null}
function leaveTower(v){const t=getB(v.tower);if(t&&t.man===v.id)t.man=null;v.tower=null;v.inT=false}
function assignWork(v){
  const t=JOBB[v.job];if(!t){v.work=null;return true}
  let best=null,bn=99;
  for(const b of built(t)){const n=S.v.filter(o=>o.work===b.id).length;if(n<BD[t].slots&&n<bn){bn=n;best=b}}
  v.work=best?best.id:null;return !!best;
}
function slots(k){
  if(k==='builder')return 99;
  if(k==='spear'||k==='archer')return soldierCap()-soldiers()+S.v.filter(v=>v.job===k).length;
  return built(JOBB[k]).length*BD[JOBB[k]].slots;
}
function setJob(k,delta){
  if(delta>0){
    for(let i=0;i<delta;i++){
      const cur=S.v.filter(v=>v.job===k).length;if(cur>=slots(k))break;
      const idle=S.v.filter(v=>v.job==='idle').sort((a,b)=>(a.carry?1:0)-(b.carry?1:0));
      const v=idle[0];if(!v)break;
      const ratio=v.hp/maxHp(v);v.job=k;resetTask(v);
      if(!assignWork(v)){v.job='idle';break}
      v.hp=maxHp(v)*Math.max(0.5,ratio);
    }
  }else{
    for(let i=0;i<-delta;i++){
      const list=S.v.filter(v=>v.job===k);const v=list.find(x=>!x.carry)||list[list.length-1];if(!v)break;
      const ratio=v.hp/maxHp(v);if(v.tower)leaveTower(v);
      v.job='idle';v.work=null;resetTask(v);v.hp=maxHp(v)*ratio;
    }
  }
  refresh();
}
function assignHomes(){
  const houses=built('house');const occ={};
  for(const v of S.v){
    if(isSol(v)){v.home=null;continue}
    let best=null,bd=1e9;
    for(const h of houses){if((occ[h.id]||0)>=4)continue;const [cx,cy]=cen(h),d=Math.hypot(cx-v.x,cy-v.y);if(d<bd){bd=d;best=h}}
    if(best){occ[best.id]=(occ[best.id]||0)+1;v.home=best.id}else v.home=null;
  }
}
function kill(v,how){
  if(!v||v.dead)return;
  v.dead=true;if(v.tower)leaveTower(v);
  S.v=S.v.filter(x=>x!==v);
  const job=JOBNAME[v.job].toLowerCase();
  const msg={slain:`${v.name} the ${job} was killed by raiders.`,starved:`${v.name} starved to death.`,froze:`${v.name} froze in the cold.`,sick:`${v.name} died of the sickness.`}[how];
  log(msg,'bad');S.grief+=4;if(!v.inside&&!v.inT){blood(v.x,v.y-6,6);ANIMS.push({k:'corpse',x:v.x,y:v.y,t:0,v:look(v),face:v.face||1})}SFX.play('die',v.x,v.y);
  if(sel&&sel.k==='v'&&sel.id===v.id)sel=null;
  if(!S.v.length)gameOver('Nobody is left in the settlement.');
}
function moveTo(v,x,y,dt,spd){
  const dx=x-v.x,dy=y-v.y,d=Math.hypot(dx,dy);
  if(d<1.5){v.x=x;v.y=y;return true}
  const s=Math.min(d,spd*dt);v.x+=dx/d*s;v.y+=dy/d*s;v.moving=true;if(Math.abs(dx)>0.5)v.face=dx<0?-1:1;v.wp=(v.wp||0)+dt*13;addWear(v.x,v.y,dt);return false;
}
function wander(v,dt,cx,cy,r){
  if(v.wx==null||Math.hypot(v.wx-cx,v.wy-cy)>r*1.5+4){v.wx=cx+rnd(-r,r);v.wy=cy+rnd(-r,r);v.wt=rnd(1,4)}
  if(moveTo(v,v.wx,v.wy,dt,WALK*0.5)){v.wt-=dt;if(v.wt<=0){v.wx=cx+rnd(-r,r);v.wy=cy+rnd(-r,r);v.wt=rnd(1.5,5)}}
}
function nearestStore(x,y){
  let best=null,bd=1e9;
  for(const b of S.b){if(!b.built||!BD[b.type].store)continue;const [cx,cy]=doorOf(b),d=Math.hypot(cx-x,cy-y);if(d<bd){bd=d;best=b}}
  return best;
}
function deposit(v,s){
  const k=v.carry.k,n=v.carry.n,got=addRes(k,n),[x,y]=doorOf(s);
  float(x,y-12,got+0.01<n?'storage full':`+${n} ${RESN[k]}`,got+0.01<n?'#d8664c':RESCOL[k]);SFX.play('deposit',x,y);
  v.carry=null;
}
function deliver(v,dt){
  const s=nearestStore(v.x,v.y);if(!s){v.carry=null;return}
  const [dx,dy]=doorOf(s,v);
  v.status=`Carrying ${v.carry.n} ${RESN[v.carry.k]} to the ${BD[s.type].name.toLowerCase()}`;
  if(moveTo(v,dx,dy,dt,WALK))deposit(v,s);
}
const restTime=()=>S.phase==='night'||S.bell||(S.pol.hours!=='long'&&S.t>=DAY-12);

function vUpdate(v,dt){
  if(v.dead)return;
  v.moving=false;v.working=false;
  if(isSol(v))return solUpdate(v,dt);
  if(S.rest){
    if(v.inside){v.status='Asleep';return}
    const h=getB(v.home)||hallB();if(!h)return;
    const [dx,dy]=doorOf(h,v);
    v.status=S.phase==='night'||S.bell?'Running for shelter':'Heading home';
    if(moveTo(v,dx,dy,dt,WALK*(S.phase==='night'||S.bell?1.4:1.1))){v.inside=true;if(v.carry&&BD[h.type].store)deposit(v,h)}
    return;
  }
  if(v.inside){v.inside=false;const h=getB(v.home)||hallB();if(h)[v.x,v.y]=doorOf(h,v)}
  v.hp=Math.min(maxHp(v),v.hp+dt);
  switch(v.job){
    case 'farmer':return farmer(v,dt);
    case 'hunter':return hunter(v,dt);
    case 'cutter':return gatherer(v,dt,'t',1.0,'wood','Felling a tree');
    case 'mason':return gatherer(v,dt,'r',1.6,'stone','Cutting stone');
    case 'miner':return gatherer(v,dt,'o',2.2,'iron','Digging ore');
    case 'smith':case 'scholar':return crafter(v,dt);
    case 'builder':return builder(v,dt);
    default:{
      if(v.carry)return deliver(v,dt);
      const h=hallB();if(h){wander(v,dt,HCX,HCY+48,30)}
      v.status='Idle, waiting for a job';
    }
  }
}
function toIdle(v){v.job='idle';v.work=null;resetTask(v)}
const plotPos=(f,i)=>[(f.x+(i%3)+0.5)*TS,(f.y+Math.floor(i/3)+0.5)*TS];
function farmer(v,dt){
  const f=getB(v.work);if(!f||!f.built){toIdle(v);return}
  const yld=S.tech.crop?7:6;
  let p=v.plot!=null?f.plots[v.plot]:null;
  if(!p||!(p.s==='ripe'||p.s==='empty')){
    v.plot=null;v.timer=0;
    if(v.carry&&v.carry.n+yld>carryCap()*2+2)return deliver(v,dt);
    const claimed=new Set(S.v.filter(o=>o!==v&&o.work===f.id&&o.plot!=null).map(o=>o.plot));
    let best=-1;
    for(let i=0;i<9;i++)if(!claimed.has(i)&&f.plots[i].s==='ripe'){best=i;break}
    if(best<0&&v.carry)return deliver(v,dt);
    if(best<0)for(let i=0;i<9;i++)if(!claimed.has(i)&&f.plots[i].s==='empty'){best=i;break}
    if(best<0){
      const [cx,cy]=cen(f);wander(v,dt,cx,cy,22);
      v.status=isWinter()&&!S.tech.cellar?'Waiting out the winter frost':'Waiting for the crops to grow';return;
    }
    v.plot=best;p=f.plots[best];
  }
  const [px,py]=plotPos(f,v.plot);
  if(!moveTo(v,px+v.j*0.6,py+4,dt,WALK)){v.status=p.s==='ripe'?'Walking to ripe crops':'Walking to sow a plot';return}
  v.working=true;v.timer+=dt*workMult();
  if(p.s==='empty'){v.status='Sowing';if(v.timer>=1.5){p.s='grow';p.g=0;v.plot=null;v.timer=0;SFX.play('sow',px,py);puff(px,py+4,3,'#7a5a3a')}}
  else{v.status='Harvesting';if(v.timer>=2){p.s='empty';p.g=0;v.plot=null;v.timer=0;v.carry=v.carry||{k:'food',n:0};v.carry.n+=yld;SFX.play('harvest',px,py);burst(px,py,'#e8c24e',6)}}
}
function findRes(b,kind,v){
  const d=BD[b.type],[cx,cy]=cen(b),R=d.reach*TS;
  const claims={};for(const o of S.v)if(o.tile!=null&&o!==v)claims[o.tile]=(claims[o.tile]||0)+1;
  let best=null,bs=1e9;
  const x0=Math.max(0,Math.floor((cx-R)/TS)),x1=Math.min(GW-1,Math.floor((cx+R)/TS)),y0=Math.max(0,Math.floor((cy-R)/TS)),y1=Math.min(GH-1,Math.floor((cy+R)/TS));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const t=S.map[idx(x,y)];if(t.t!==kind||t.a<=0)continue;
    const tx=(x+0.5)*TS,ty=(y+0.5)*TS;if(Math.hypot(tx-cx,ty-cy)>R)continue;
    const s=Math.hypot(tx-cx,ty-cy)+(claims[idx(x,y)]||0)*70;if(s<bs){bs=s;best=idx(x,y)}
  }
  return best;
}
function gatherer(v,dt,kind,rate,rk,verb){
  const b=getB(v.work);if(!b||!b.built){toIdle(v);return}
  if(v.carry&&v.carry.n>=carryCap())return deliver(v,dt);
  let t=v.tile!=null?S.map[v.tile]:null;
  if(!t||t.t!==kind||t.a<=0){
    v.tile=findRes(b,kind,v);v.timer=0;
    if(v.tile==null){
      if(v.carry)return deliver(v,dt);
      const [cx,cy]=cen(b);wander(v,dt,cx,cy+18,14);v.status=`No ${TILEN[kind]} left in reach. Build a new ${BD[b.type].name.toLowerCase()} elsewhere`;return;
    }
    t=S.map[v.tile];
    const tx=(v.tile%GW+0.5)*TS,ty=(Math.floor(v.tile/GW)+0.5)*TS,[bx,by]=cen(b),dd=Math.hypot(bx-tx,by-ty)||1;
    v.ax=tx+(bx-tx)/dd*9+rnd(-3,3);v.ay=ty+(by-ty)/dd*9+rnd(-3,3);
  }
  if(!moveTo(v,v.ax,v.ay,dt,WALK)){v.status=`Walking to the ${TILEN[kind]}`;return}
  v.working=true;v.status=verb;
  v.timer+=dt*workMult()*(S.tech.tools?1.25:1);
  if(v.timer>=rate){
    v.timer-=rate;t.a--;v.carry=v.carry||{k:rk,n:0};v.carry.n++;SFX.play(kind==='t'?'chop':kind==='r'?'pick':'dig',v.x);burst(v.ax,v.ay-4,kind==='t'?'#c49a62':kind==='r'?'#c8c4ba':'#7a7068',3);
    if(t.a<=0){const ti=v.tile;if(kind==='t'){t.t='s';t.rg=0;ANIMS.push({k:'fall',i:ti,t:0,dir:v.x<(ti%GW+0.5)*TS?1:-1});SFX.play('fall',v.ax,v.ay)}else{t.t='g';puff(v.ax,v.ay,8,'#a8a49a');SFX.play('dig',v.ax,v.ay)}t.a=0;v.tile=null;mapDirty=true}
  }
}
/* ---------- wildlife & weather ---------- */
function spawnHerd(init){
  for(let tries=0;tries<40;tries++){
    const x=rnd(40,W-40),y=rnd(40,H-40);
    const dd=Math.hypot(x-HCX,y-HCY);if(dd<(init?220:420)||(init&&S.deer.length<8&&dd>420))continue;
    const n=3+Math.floor(Math.random()*3),herd=S.nid++;
    for(let i=0;i<n;i++)S.deer.push({id:S.nid++,herd,x:x+rnd(-25,25),y:y+rnd(-25,25),hp:20,t:rnd(0,3),tx:null,ty:null,scared:0,face:1,wp:0,mv:false,stag:Math.random()<0.3});
    return;
  }
}
function wildlife(dt){
  S.deerT=(S.deerT||0)+dt;
  if(S.deerT>=40){S.deerT=0;if(S.deer.length<18)spawnHerd(false)}
  for(const d of S.deer){
    d.t-=dt;d.scared-=dt;d.mv=false;
    let th=null,td=1e9;
    for(const v of S.v){if(v.inside||v.inT)continue;const q=Math.hypot(v.x-d.x,v.y-d.y),lim=v.job==='hunter'?36:60;if(q<lim&&q<td){td=q;th=v}}
    for(const e of S.enemies){const q=Math.hypot(e.x-d.x,e.y-d.y);if(q<70&&q<td){td=q;th=e}}
    if(th){d.fx=th.x;d.fy=th.y}
    if(th||d.scared>0){
      const ax=d.x-(d.fx??d.x-1),ay=d.y-(d.fy??d.y),l=Math.hypot(ax,ay)||1;
      d.x+=ax/l*78*dt;d.y+=ay/l*78*dt;d.mv=true;d.face=ax<0?-1:1;d.wp+=dt*16;d.tx=null;d.graze=false;
    }else{
      if(d.tx==null&&d.t<=0){
        if(Math.random()<0.55){d.t=rnd(2,5);d.graze=true}
        else{let hx=0,hy=0,n=0;for(const o of S.deer)if(o.herd===d.herd){hx+=o.x;hy+=o.y;n++}d.tx=hx/n+rnd(-45,45);d.ty=hy/n+rnd(-45,45);d.t=rnd(3,7);d.graze=false}
      }
      if(d.tx!=null){const ax=d.tx-d.x,ay=d.ty-d.y,l=Math.hypot(ax,ay);if(l>2&&d.t>0){d.x+=ax/l*16*dt;d.y+=ay/l*16*dt;d.mv=true;d.face=ax<0?-1:1;d.wp+=dt*8}else d.tx=null}
    }
    d.x=clamp(d.x,6,W-6);d.y=clamp(d.y,6,H-6);
  }
  for(const c of S.carc)c.t+=dt;
  if(S.carc.length)S.carc=S.carc.filter(c=>c.t<120);
}
function deerHit(d,dmg){
  d.hp-=dmg;d.scared=3;blood(d.x,d.y-5,3);
  if(d.hp<=0){S.deer=S.deer.filter(x=>x!==d);S.carc.push({id:S.nid++,x:d.x,y:d.y,t:0,face:d.face,stag:d.stag});SFX.play('edie',d.x,d.y)}
}
function hunter(v,dt){
  const b=getB(v.work);if(!b||!b.built){toIdle(v);return}
  if(v.carry)return deliver(v,dt);
  const [bx,by]=cen(b),R=BD.lodge.reach*TS;
  let c=v.carc!=null?S.carc.find(x=>x.id===v.carc):null;
  if(!c){c=S.carc.find(x=>Math.hypot(x.x-bx,x.y-by)<R+120&&!S.v.some(o=>o!==v&&o.carc===x.id))||null;v.carc=c?c.id:null}

function nearestEnemy(x,y,r){let best=null,bd=r;for(const e of S.enemies){if(e.hp<=0)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;best=e}}return best}
function chooseTarget(v){

function planWave(n){
  let budget=1.5+1.0*n+0.11*n*n;const boss=n%5===0;if(boss)budget*=0.7;
  const k=n<4?1:n<9?2:3;
  const edges=shuffle(['north','east','south','west']).slice(0,k).map(e=>({e,p:rnd(0.25,0.75)}));
  const avail=Object.entries(EN).filter(([,d])=>d.from<=n);
  const tw=avail.reduce((s,[,d])=>s+d.w,0),list=[];
  while(budget>0){let r=Math.random()*tw,p=avail[0];for(const a of avail){r-=a[1].w;if(r<=0){p=a;break}}list.push(p[0]);budget-=p[1].cost}
  const dur=10+n*0.8;
  const q=list.map(type=>({type,at:rnd(0,dur),src:Math.floor(Math.random()*k)}));
  if(boss)q.push({type:'warlord',at:dur*0.5,src:0});
  q.sort((a,b)=>a.at-b.at);
  return{n,edges,boss,queue:q,count:q.length,dur};
}
function threatPos(ed){const dir={north:[0,-1],south:[0,1],west:[-1,0],east:[1,0]}[ed.e],off=(ed.p-0.5)*700;return[clamp(HCX+dir[0]*620-dir[1]*off,10,W-10),clamp(HCY+dir[1]*620+dir[0]*off,10,H-10)]}

function spawn(item,x,y){

  const hp=d.hp*hs*(item.type==='warlord'?1+0.3*(n/5-1):1);
  S.enemies.push({type:item.type,x,y,hp,max:hp,spd:d.spd*rnd(0.9,1.1),r:d.r,dmg:d.dmg*(1+0.05*(n-1)),bd:d.bd*(1+0.05*(n-1)),cd:rnd(0,1),fl:0,rt:0,tgt:null,st:7});if(item.type==='wolf')SFX.play('howl',x,y);
}
function rectDist(b,x,y){const nx=clamp(x,b.x*TS,(b.x+b.w)*TS),ny=clamp(y,b.y*TS,(b.y+b.h)*TS);return[Math.hypot(nx-x,ny-y),nx,ny]}

function eUpdate(e,dt){

function separate(){
  const es=S.enemies;
  for(let i=0;i<es.length;i++)for(let j=i+1;j<es.length;j++){
    const a=es[i],b=es[j],dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;
    if(Math.abs(dx)>m||Math.abs(dy)>m)continue;
    const d=Math.hypot(dx,dy)||0.01;if(d<m){const p=(m-d)/2/d;a.x-=dx*p;a.y-=dy*p;b.x+=dx*p;b.y+=dy*p}
  }
}

/* ---------- world ---------- */
function world(dt){
  const win=isWinter(),gt=40*(S.tech.crop?0.75:1),gm=(win?(S.tech.cellar?0.4:0):1)*(1+0.4*(S.wx?S.wx.rain:0));
  for(const b of S.b)if(b.type==='field'&&b.built)for(const p of b.plots)if(p.s==='grow'){p.g+=dt/gt*gm;if(p.g>=1){p.s='ripe';p.g=1}}
  const rg=S.tech.forestry?80:300;
  S.stT=(S.stT||0)+dt;if(S.stT>=1){const st=S.stT;S.stT=0;for(const t of S.map)if(t.t==='s'){t.rg=(t.rg||0)+st;if(t.rg>=rg){t.t=t.b==null?'t':'g';t.a=t.t==='t'?25:0;t.rg=0;mapDirty=true}}}
  weather(dt);wildlife(dt);
  const pop=S.v.length;
  const eat=pop*0.05*RATION[S.pol.ration].m*dt;
  if(S.res.food>=eat){addRes('food',-eat);S.starving=false}else{addRes('food',-S.res.food);S.starving=true}
  if(S.starving){S.starveT+=dt;if(S.starveT>=20){S.starveT=0;const vs=S.v.filter(v=>v.job==='idle');kill(pickOne(vs.length?vs:S.v),'starved')}}else S.starveT=0;
  if(win){const w=pop*0.02*dt;if(S.res.wood>=w){addRes('wood',-w);S.cold=false}else{addRes('wood',-S.res.wood);S.cold=true}}else S.cold=false;
  if(S.cold){S.coldT+=dt;if(S.coldT>=30){S.coldT=0;kill(pickOne(S.v),'froze')}}else S.coldT=0;
  S.homeless=Math.max(0,pop-beds());
  let target=60+RATION[S.pol.ration].mo+8*Math.min(3,built('tavern').length)+(S.tech.civic?10:0)
    -(S.pol.hours==='long'?12:0)-Math.min(20,S.homeless*3)-(S.starving?30:0)-(S.cold?20:0)-S.grief;
  target=clamp(target,5,100);S.moraleTarget=target;
  S.morale=clamp(S.morale+(target-S.morale)*Math.min(1,dt*0.06),0,100);
  S.grief=Math.max(0,S.grief-dt*0.08);
  if(S.phase==='day'&&pop<beds()&&S.res.food>=40&&rate('food')>=0&&!S.starving&&S.morale>=45){
    S.growT+=dt*(S.morale/70);
    if(S.growT>=35){S.growT=0;const [x,y]=edgePos({e:pickOne(['north','east','south','west']),p:rnd(0.3,0.7)});const v=mkVillager(clamp(x,4,W-4),clamp(y,4,H-4));log(`${v.name} arrives looking for a new home.`,'good');SFX.play('arrive',v.x,v.y)}
  }
  for(const s of S.scorch)s.life-=dt;S.scorch=S.scorch.filter(s=>s.life>0);
  S.bkT+=dt;if(S.bkT>=10){S.bkT=0;S.bk.hist.push(S.bk.cur);S.bk.cur={};if(S.bk.hist.length>6)S.bk.hist.shift()}
}
function rate(k){const h=S.bk.hist;if(!h.length)return 0;let s=0;for(const b of h)s+=b[k]||0;return s*60/(h.length*10)}
function fx(dt){
  for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.z!=null){p.vz-=200*dt;p.z+=p.vz*dt;if(p.z<=0){p.z=0;p.vz=0;p.vx*=0.5;p.vy*=0.5}}
    else if(!(p.k==='snow'||p.k==='leaf'||p.k==='firefly')){const k=p.k==='smoke'||p.k==='dust'?0.985:0.93;p.vx*=k;p.vy*=k}
    if(p.k==='firefly'){p.vx=clamp(p.vx+rnd(-40,40)*dt,-15,15);p.vy=clamp(p.vy+rnd(-40,40)*dt,-15,15)}
    p.life-=dt;if(p.life<=0){PARTS[i]=PARTS[PARTS.length-1];PARTS.pop()}}
  for(let i=ANIMS.length-1;i>=0;i--){ANIMS[i].t+=dt;if(ANIMS[i].t>8)ANIMS.splice(i,1)}
  for(const f of S.floats){f.y-=16*dt;f.life-=dt}
  S.floats=S.floats.filter(f=>f.life>0);
  ambientFx(dt);
}
function startNight(){
  if(S.phase!=='day')return;
  S.phase='night';S.nt=0;S.t=DAY;S.queue=S.wave.queue.slice();SFX.play('horn');banner={t:`Night ${S.day}`,s:`Raiders from the ${S.wave.edges.map(e=>e.e).join(' and ')}`,life:4};
  log(`Night ${S.day} falls. ${S.wave.count} raiders come from the ${S.wave.edges.map(e=>e.e).join(' and ')}.`,'bad');
}
function dawn(){
  S.nights++;S.day++;S.phase='day';S.fleeing=false;S.t=0;S.shots=[];S.bell=false;SFX.play('bell');banner={t:`Day ${S.day}`,s:season()+(isWinter()?' · the fields are frozen':''),life:4};
  for(const v of S.v)if(v.tower)leaveTower(v);
  log(`Dawn. The settlement survives night ${S.nights}.`,'good');
  if(isWinter())log('Winter is here. Fields stop growing and everyone burns firewood.','bad');
  else if(isWinter(S.day+1))log('The air turns cold. Winter comes tomorrow. Stock food and wood.');
  S.wave=planWave(S.day);saveRun();
  if(Math.random()<0.55)setTimeout(dawnEvent,700);
}
function update(dt){
  S.time+=dt;
  if(S.phase==='day'){S.t+=dt;if(S.t>=DAY)startNight()}
  else{S.nt+=dt;while(S.queue.length&&S.queue[0].at<=S.nt)spawn(S.queue.shift());if(!S.queue.length&&S.enemies.length&&!S.fleeing&&S.nt>(S.wave.dur||40)+55){S.fleeing=true;for(const e of S.enemies)e.flee=true;log('The last raiders lose heart and retreat into the dark.','good')}if(!S.queue.length&&!S.enemies.length&&S.nt>12)dawn()}
  const rest=restTime();if(rest&&!S.rest)assignHomes();S.rest=rest;
  world(dt);
  for(const v of S.v.slice())vUpdate(v,dt);
  for(const e of S.enemies)eUpdate(e,dt);
  S.enemies=S.enemies.filter(e=>e.hp>0);
  separate();defenses(dt);shotsUpd(dt);fx(dt);
}

/* ---------- placement ---------- */
function countRes(type,x,y){
  const d=BD[type];if(!d.res)return null;
  const cx=(x+d.w/2)*TS,cy=(y+d.h/2)*TS,R=d.reach*TS;let n=0,a=0;
  const x0=Math.max(0,Math.floor((cx-R)/TS)),x1=Math.min(GW-1,Math.floor((cx+R)/TS)),y0=Math.max(0,Math.floor((cy-R)/TS)),y1=Math.min(GH-1,Math.floor((cy+R)/TS));
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const t=S.map[ty*GW+tx];if(t.t!==d.res)continue;if(Math.hypot((tx+0.5)*TS-cx,(ty+0.5)*TS-cy)<=R){n++;a+=t.a}}
  return{n,a};
}
function hidesField(type,x,y){
  if(BD[type].wall)return false;
  const d=BD[type],rows=type==='field'?[y+d.h,y+d.h+1]:[y-1,y-2];
  for(const ry of rows){if(ry<0||ry>=GH)continue;for(let tx=x;tx<x+d.w;tx++){const t=S.map[idx(tx,ry)];if(t.b==null)continue;const o=getB(t.b);if(!o)continue;
    if(type==='field'?(o.type!=='field'&&!BD[o.type].wall&&(ry===y+d.h||upOf(o.type)>TS)):(o.type==='field'&&(ry===y-1||upOf(type)>TS)))return true}}
  return false;
}
function canPlace(type,x,y){
  const d=BD[type];
  if(x<0||y<0||x+d.w>GW||y+d.h>GH)return{ok:false,msg:'Too close to the edge'};
  for(let ty=y;ty<y+d.h;ty++)for(let tx=x;tx<x+d.w;tx++){const t=S.map[idx(tx,ty)];if(t.b!=null)return{ok:false,msg:'Something is already built here'};if(t.t!=='g')return{ok:false,msg:'Needs clear ground'}}
  if(d.max&&countB(type)>=d.max)return{ok:false,msg:`You can have at most ${d.max}`};
  if(hidesField(type,x,y))return{ok:false,msg:'It would hide a field behind a building'};
  const r=countRes(type,x,y);
  if(r&&r.n<1)return{ok:false,msg:`No ${TILEN[d.res]} within reach`,r};
  if(!afford(bcost(type)))return{ok:false,msg:'Not enough materials',r};
  return{ok:true,r};
}
function placeB(type,x,y,isBuilt){
  const d=BD[type];
  const b={id:S.nid++,type,x,y,w:d.w,h:d.h,hp:maxB(type),built:!!isBuilt,trips:0,tripsN:0,prog:0,bt:0,order:S.time,man:null};
  if(!isBuilt){const c=bcost(type);const tot=Object.values(c).reduce((s,n)=>s+n,0);b.paid=c;pay(c);b.tripsN=Math.max(1,Math.ceil(tot/10));b.bt=d.wall?1.5:3+d.w*d.h*1.2;b.hp=maxB(type)*0.4}
  if(type==='field')b.plots=Array.from({length:9},()=>({s:'empty',g:0}));
  S.b.push(b);BIDX.set(b.id,b);mapDirty=true;
  for(let ty=y;ty<y+d.h;ty++)for(let tx=x;tx<x+d.w;tx++)S.map[idx(tx,ty)].b=b.id;
  return b;
}
function ghostXY(type){const d=BD[type];return[Math.floor(mouse.x/TS-d.w/2+0.5),Math.floor(mouse.y/TS-d.h/2+0.5)]}
function findSpot(type,minRes){
  let best=null,bd=1e9;const d=BD[type];
  for(let y=1;y<GH-d.h;y++)for(let x=1;x<GW-d.w;x++){
    const dist=Math.hypot(x+d.w/2-HALLX-1.5,y+d.h/2-HALLY-1.5);if(dist>=bd||dist<3)continue;
    let ok=true;for(let ty=y;ty<y+d.h&&ok;ty++)for(let tx=x;tx<x+d.w;tx++){const t=S.map[idx(tx,ty)];if(t.b!=null||t.t!=='g'){ok=false;break}}
    if(!ok||hidesField(type,x,y))continue;
    if(minRes){const r=countRes(type,x,y);if(r.n<minRes)continue}
    bd=dist;best=[x,y];
  }
  return best;
}

/* ---------- new run ---------- */
function newRun(){BIDX.clear();
  S={seed:Math.floor(Math.random()*1e9),deer:[],carc:[],wx:{rain:0,target:0,t:90},day:1,phase:'day',t:0,nt:0,time:0,map:genMap(),b:[],v:[],nid:1,
    res:{food:70+30*U().stores,wood:60+30*U().stores,stone:10,iron:0,arms:0,lore:0},
    pol:{ration:'normal',hours:'normal',stance:'hold'},bell:false,flag:{x:HCX,y:HCY+70},
    tech:{},armory:0,morale:65,moraleTarget:65,grief:0,growT:0,starveT:0,coldT:0,starving:false,cold:false,homeless:0,
    nights:0,kills:0,wave:null,queue:[],enemies:[],shots:[],parts:[],floats:[],scorch:[],log:[],
    bk:{cur:{},hist:[]},bkT:0,rest:false,hallCd:0};
  placeB('hall',HALLX,HALLY,true);
  placeB('house',HALLX-3,HALLY,true);
  placeB('house',HALLX+4,HALLY+1,true);
  let p=findSpot('field');if(p)placeB('field',p[0],p[1],true);
  p=findSpot('lumber',8);if(p)placeB('lumber',p[0],p[1],true);
  const n=8+U().settlers;
  for(let i=0;i<n;i++)mkVillager(HCX+rnd(-40,40),HCY+rnd(30,60));
  const plan=['farmer','farmer','cutter','cutter','builder','spear','spear'];
  S.v.forEach((v,i)=>{if(plan[i]){v.job=plan[i];if(!assignWork(v))v.job='idle';v.hp=maxHp(v)}});
  S.wave=planWave(1);
  for(let i=0;i<7;i++)spawnHerd(true);
  log('The settlement is founded. Look at the scouts\' report and prepare before dusk.');
}

    mus=ac.createGain();mus.gain.value=music?0.55:0;mus.connect(master);
    const len=ac.sampleRate*2;noiseBuf=ac.createBuffer(1,len,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const il=Math.floor(ac.sampleRate*2.4),ir=ac.createBuffer(2,il,ac.sampleRate);

  r.innerHTML='<div class="rmain"><div class="rtitle"><span class="rname"></span><span class="rcount"></span></div><div class="rdesc"></div><div class="rcost"></div></div><button class="btn"></button>';
  parent.appendChild(r);
  const o={el:r,name:r.querySelector('.rname'),count:r.querySelector('.rcount'),desc:r.querySelector('.rdesc'),cost:r.querySelector('.rcost'),btn:r.querySelector('.btn')};
  o.name.textContent=name;o.btn.onclick=click;return o;
}
function sect(p,t){const d=document.createElement('div');d.className='sect';d.textContent=t;p.appendChild(d)}
function note(p,t=''){const d=document.createElement('div');d.className='note';d.textContent=t;p.appendChild(d);return d}
const costHTML=c=>Object.entries(c).map(([k,v])=>`<span class="${S.res[k]>=v?'':'short'}">${v} ${RESN[k]}</span>`).join('');
function optGroup(p,title,key,table,onPick){
  const box=document.createElement('div');box.className='optrow';
  box.innerHTML=`<div class="rname">${title}</div><div class="seg"></div><div class="rdesc"></div>`;p.appendChild(box);
  const seg=box.querySelector('.seg'),btns={};
  for(const k in table){const b=document.createElement('button');b.className='btn sm';b.textContent=table[k].label;b.onclick=()=>{onPick(k);refresh()};seg.appendChild(b);btns[k]=b}
  ui.ord[key]={btns,desc:box.querySelector('.rdesc'),table};
}
function buildPanel(){
  const res=$('#res');res.innerHTML='';
  for(const [k,n] of RES){const d=document.createElement('div');d.className='rc';d.innerHTML=`<div class="k">${n}</div><div class="v"></div><div class="d"></div>`;res.appendChild(d);ui.res[k]={v:d.querySelector('.v'),d:d.querySelector('.d')}}
  const w=$('#tab-jobs');w.innerHTML='';
  ui.jobNote=note(w);
  for(const j of JOBS){
    const r=document.createElement('div');r.className='row';
    r.innerHTML=`<div class="rmain"><div class="rtitle"><span class="rname"><span class="dot" style="background:${JOBCOL[j.k]}"></span> ${j.name}</span><span class="rcount"></span></div><div class="rdesc"></div></div><div class="jobbtns"><button class="btn sq" aria-label="Remove one">−</button><button class="btn sq" aria-label="Add one">+</button></div>`;
    w.appendChild(r);const [m,p]=r.querySelectorAll('button');
    m.onclick=e=>setJob(j.k,e.shiftKey?-5:-1);p.onclick=e=>setJob(j.k,e.shiftKey?5:1);
    ui.jobs[j.k]={count:r.querySelector('.rcount'),desc:r.querySelector('.rdesc'),m,p};
  }
  const b=$('#tab-build');b.innerHTML='';
  note(b,'Pick a building, then click the map. Builders fetch materials from storage and put it up.');
  for(const k of Object.keys(BD)){if(k==='hall')continue;
    ui.bld[k]=mkRow(b,BD[k].name,()=>pickBuild(k));ui.bld[k].desc.textContent=BD[k].desc}
  const o=$('#tab-orders');o.innerHTML='';
  optGroup(o,'Rations','ration',RATION,k=>{S.pol.ration=k});
  optGroup(o,'Work hours','hours',HOURS,k=>{S.pol.hours=k});
  optGroup(o,'Soldier orders','stance',STANCE,k=>{S.pol.stance=k;for(const v of S.v)v.rt=0});
  ui.flagRow=mkRow(o,'Rally flag',()=>{mode=mode&&mode.k==='flag'?null:{k:'flag'};refresh()});ui.flagRow.desc.textContent='Where soldiers gather at night. Under "Hold the flag" they fight only within the dashed circle.';
  ui.bellRow=mkRow(o,'Alarm bell',()=>{S.bell=!S.bell;if(S.bell){assignHomes();SFX.play('alarm')}log(S.bell?'The alarm bell rings. Everyone runs for shelter.':'The bell falls silent. Back to work.');refresh()});ui.bellRow.desc.textContent='Send every civilian indoors right now. Work stops until you call them out.';
  sect(o,'Armory');
  ui.armRow=mkRow(o,'Soldier equipment',()=>{const c=armoryCost();if(S.res.arms<c)return;addRes('arms',-c);S.armory++;for(const v of S.v)if(isSol(v))v.hp+=maxHp(v)*0.15;log(`Soldiers are re-equipped. Armory level ${S.armory}.`,'good');SFX.play('anvil');refresh()});
  ui.armRow.desc.textContent='+25% soldier damage and +20% HP per level. Smiths make arms.';
  const l=$('#tab-lore');l.innerHTML='';
  ui.loreNote=note(l);
  for(const t of TECH){ui.tech[t.k]=mkRow(l,t.name,()=>{if(S.tech[t.k]||S.res.lore<t.cost)return;addRes('lore',-t.cost);
    if(t.k==='masonry')for(const b of S.b)b.hp*=1.5;S.tech[t.k]=true;log(`Research complete: ${t.name}.`,'good');SFX.play('research');refresh()});ui.tech[t.k].desc.textContent=t.desc}
}
let activeTab='jobs';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));for(const t of['jobs','build','orders','lore'])$('#tab-'+t).hidden=t!==activeTab;refresh()});
$('#selBtn').onclick=()=>{
  if(!sel||sel.k!=='b')return;const b=getB(sel.id);if(!b||b.type==='hall')return;
  if(performance.now()-demoArm>3000){demoArm=performance.now();refresh();return}
  const back=b.built?0.5:1;if(b.paid)for(const k in b.paid)addRes(k,Math.floor(b.paid[k]*back));
  destroyB(b,true);log(`The ${BD[b.type].name.toLowerCase()} was taken down.`);sel=null;demoArm=0;refresh();
};

function rateHTML(k){const v=rate(k);const c=v>0.5?'pos':v<-0.5?'neg':'zero';return`<span class="${c}">${v>=0?'+':''}${Math.round(v)}/min</span>`}
function refresh(){
  if(!S)return;
  $('#dayTitle').textContent=`Day ${S.day}`;
  const se=$('#season');
  if(isWinter()){se.textContent='Winter · fields frozen, firewood burns';se.className='eyebrow winter'}
  else{let u=1;while(!isWinter(S.day+u))u++;se.textContent=`${season()} · winter in ${u} day${u>1?'s':''}`;se.className='eyebrow'}
  $('#phaseTxt').textContent=S.phase==='day'?(S.t<DAY-12?`Dusk in ${Math.ceil(DAY-12-S.t)}s`:`Night in ${Math.ceil(DAY-S.t)}s`):`Night · ${S.queue.length+S.enemies.length} raiders left`;
  $('#duskBar').style.width=(S.phase==='day'?100*(1-S.t/DAY):0)+'%';
  document.querySelectorAll('#speeds .btn').forEach(b=>b.setAttribute('aria-pressed',paused?b.dataset.sp==='0':+b.dataset.sp===speed));
  const wv=S.wave;
  $('#scout').innerHTML=wv?`Scouts: <b>~${wv.count} raiders</b> from the <b>${wv.edges.map(e=>e.e).join(' and ')}</b> tonight${wv.boss?'. <b>A warlord leads them.</b>':'.'}`:'';
  for(const [k] of RES){const c=cap(k);ui.res[k].v.innerHTML=fmt(S.res[k])+(c===Infinity?'':`<small>/${fmt(c)}</small>`);ui.res[k].d.innerHTML=rateHTML(k)}
  const idle=S.v.filter(v=>v.job==='idle').length;
  $('#popTxt').textContent=`People ${S.v.length} · beds ${beds()} · idle ${idle}`;
  $('#moraleTxt').textContent=`Morale ${Math.round(S.morale)} → ${Math.round(S.moraleTarget)} · work ×${workMult().toFixed(2)}`;
  $('#moraleBar').style.width=S.morale+'%';
  const w=[];
  if(S.starving)w.push('Starving. People will die.');
  if(S.cold)w.push('No firewood. People will freeze.');
  if(S.homeless)w.push(`${S.homeless} without a bed.`);
  if(S.bell)w.push('The alarm bell is ringing. Nobody is working.');
  if(S.res.food<30&&!S.starving)w.push('Food is running low.');
  if(S.b.some(b=>!b.built)&&!S.v.some(v=>v.job==='builder'))w.push('Construction is waiting for builders.');
  if(!hallB())w.push('The hall is gone.');
  $('#warn').textContent=w.join(' ');
  if(activeTab==='jobs'){
    ui.jobNote.textContent=`${idle} idle. Shift-click moves 5. Soldier posts: ${soldiers()}/${soldierCap()}.`;
    const wm=workMult();
    const D={farmer:'Sow and harvest fields. Carry food to storage.',cutter:'Fell trees near their hut and carry wood back.',hunter:'Hunt deer near the lodge. Each deer gives 10 food.',mason:'Cut rock near the quarry.',miner:'Dig iron ore near the mine.',
      smith:'Turn iron and wood into arms at the forge.',scholar:'Write lore at the library.',builder:'Carry materials to sites, build and repair.',
      spear:`Melee. ${Math.round(60*maxHp({job:'spear'})/60)} HP, ${spearDmg().toFixed(0)} damage.`,archer:`Ranged. ${Math.round(maxHp({job:'archer'}))} HP, ${archDmg().toFixed(0)} damage. Mans watchtowers.`};
    for(const j of JOBS){const o=ui.jobs[j.k],s=slots(j.k),n=S.v.filter(v=>v.job===j.k).length;
      o.count.textContent=j.k==='builder'?`${n}`:`${n}/${j.k==='spear'||j.k==='archer'?soldierCap():s}`;
      o.desc.textContent=s||j.k==='builder'?D[j.k]:`Build a ${BD[j.b||'barracks'].name.toLowerCase()} first.`;
      if((j.k==='spear'||j.k==='archer')&&soldiers()>=soldierCap())o.desc.textContent=D[j.k]+' All soldier posts are full. Build barracks.';
      o.m.disabled=n<=0;o.p.disabled=idle<=0||n>=s}
  }
  if(activeTab==='build'){
    for(const k in ui.bld){const o=ui.bld[k],c=bcost(k),mx=BD[k].max,n=countB(k),at=mx&&n>=mx;
      o.count.textContent=mx?`${n}/${mx}`:`×${n}`;o.cost.innerHTML=at?'':costHTML(c);
      const on=mode&&mode.type===k;o.btn.textContent=on?'Cancel':'Place';o.btn.disabled=!on&&(at||!afford(c));o.btn.setAttribute('aria-pressed',on)}
  }
  if(activeTab==='orders'){
    for(const key in ui.ord){const g=ui.ord[key],cur=S.pol[key];for(const k in g.btns)g.btns[k].setAttribute('aria-pressed',k===cur);g.desc.textContent=g.table[cur].desc}
    ui.flagRow.btn.textContent=mode&&mode.k==='flag'?'Cancel':'Move';ui.flagRow.btn.setAttribute('aria-pressed',!!(mode&&mode.k==='flag'));
    ui.bellRow.btn.textContent=S.bell?'Silence':'Ring';ui.bellRow.btn.setAttribute('aria-pressed',S.bell);
    ui.armRow.count.textContent=`level ${S.armory}`;ui.armRow.cost.innerHTML=costHTML({arms:armoryCost()});ui.armRow.btn.textContent='Equip';ui.armRow.btn.disabled=S.res.arms<armoryCost();
  }
  if(activeTab==='lore'){
    ui.loreNote.textContent=built('library').length?'Scholars at the library write lore.':'Build a library and assign scholars to produce lore.';
    for(const t of TECH){const o=ui.tech[t.k],done=!!S.tech[t.k];o.cost.innerHTML=done?'':costHTML({lore:t.cost});o.btn.textContent=done?'Known':'Study';o.btn.disabled=done||S.res.lore<t.cost;o.el.style.opacity=done?0.6:1}
  }
  refreshSel();
  $('#log').innerHTML=S.log.slice(0,6).map(l=>`<div class="${l.kind}">${l.msg}</div>`).join('');
  updPlaceBar();
}
function refreshSel(){
  const box=$('#selBox');
  let o=null;if(sel)o=sel.k==='v'?getV(sel.id):getB(sel.id);
  if(!o){box.hidden=true;return}
  box.hidden=false;const btn=$('#selBtn');
  if(sel.k==='v'){
    $('#selName').textContent=o.name;$('#selSub').textContent=`${JOBNAME[o.job]} · ${Math.ceil(o.hp)}/${Math.round(maxHp(o))} HP`;
    const home=getB(o.home);
    $('#selBody').innerHTML=`<b>${o.status}</b>${o.carry?` · carrying ${o.carry.n} ${RESN[o.carry.k]}`:''}<br>${isSol(o)?'Sleeps at the barracks between battles.':home?'Sleeps in a house.':'Sleeps on the hall floor.'}`;
    btn.hidden=true;$('#selFollow').hidden=false;$('#selFollow').textContent=follow===o.id?'Stop following':'Follow';return;
  }
  const b=o,d=BD[b.type],ws=S.v.filter(v=>v.work===b.id);
  $('#selName').textContent=d.name;$('#selSub').textContent=`${Math.ceil(b.hp)}/${Math.round(maxB(b.type))} HP`;
  let t='';
  if(!b.built)t=`<b>Under construction.</b> Materials ${b.trips}/${b.tripsN} delivered · building ${Math.floor(100*b.prog/b.bt)}%. ${S.v.filter(v=>v.site===b.id).length} builders on it.`;
  else{
    if(b.type==='field'){const c={empty:0,grow:0,ripe:0};b.plots.forEach(p=>c[p.s]++);t=`<b>${c.ripe}</b> ripe · <b>${c.grow}</b> growing · <b>${c.empty}</b> empty. `}
    if(d.res){const r=countRes(b.type,b.x,b.y);t=`<b>${r.n}</b> ${TILEN[d.res]} in reach, ${r.a} ${{t:'wood',r:'stone',o:'iron'}[d.res]} left. `}
    if(b.type==='lodge'){const [cx,cy]=cen(b),RR=d.reach*TS;t=`<b>${S.deer.filter(x=>Math.hypot(x.x-cx,x.y-cy)<RR).length}</b> deer in range. `}
    if(b.type==='house'){const rs=S.v.filter(v=>v.home===b.id);t=rs.length?`Residents: ${rs.map(v=>v.name).join(', ')}. `:'Nobody has slept here yet. '}
    if(b.type==='tower'){const m=getV(b.man);t=m?`Manned by ${m.name}. `:'Unmanned. Archers climb towers at night. '}
    if(d.slots)t+=ws.length?`Workers: ${ws.map(v=>v.name).join(', ')} (${ws.length}/${d.slots}).`:`No workers. Assign ${JOBNAME[d.job].toLowerCase()}s in Jobs.`;
    if(b.type==='hall'||b.type==='stockpile'||b.type==='barracks'||b.type==='tavern'||b.type==='forge'||b.type==='library')t+=' '+d.desc;
  }
  $('#selBody').innerHTML=t;
  $('#selFollow').hidden=true;btn.hidden=b.type==='hall';
  btn.textContent=performance.now()-demoArm<3000?(b.built?'Click again: demolish for 50% refund':'Click again: cancel for a full refund'):(b.built?'Demolish':'Cancel construction');
}

/* ---------- modals ---------- */
function showModal(build){modalOpen=true;mode=null;const c=$('#modalCard');c.innerHTML='';build(c);$('#modal').hidden=false}
function closeModal(){modalOpen=false;$('#modal').hidden=true;refresh()}
function addBtns(card,opts){
  const box=document.createElement('div');box.className='opts';
  for(const o of opts){const b=document.createElement('button');b.className='btn'+(o.primary?' primary':'');b.textContent=o.label;b.disabled=!!o.disabled;b.onclick=()=>{const keep=o.fn&&o.fn();if(!keep)closeModal()};box.appendChild(b)}
  card.appendChild(box);
}
function h(card,tag,html){const e=document.createElement(tag);e.innerHTML=html;card.appendChild(e);return e}
const EVENTS=[
  ()=>{const k=2+Math.floor(Math.random()*2)+Math.floor(S.day/6);return{t:'Refugees on the road',p:`${k} people from a burned farmstead are walking toward your hall. They will need food and beds.`,o:[
    {label:`Take them in (+${k} people)`,fn:()=>{const [x,y]=edgePos({e:pickOne(['north','east','south','west']),p:0.5});for(let i=0;i<k;i++)mkVillager(clamp(x+rnd(-20,20),4,W-4),clamp(y+rnd(-20,20),4,H-4));log(`${k} refugees join the settlement.`,'good');SFX.play('arrive',x,y)}},
    {label:'Turn them away (−6 morale)',fn:()=>{S.morale-=6}}]}},
  ()=>({t:'A caravan stops',p:'Traders will barter before moving on to safer roads.',o:[
    {label:'Trade 60 wood for 15 iron',req:{wood:60},fn:()=>{pay({wood:60});addRes('iron',15)}},
    {label:'Trade 50 food for 35 stone',req:{food:50},fn:()=>{pay({food:50});addRes('stone',35)}},
    {label:'Trade 15 arms for 80 food',req:{arms:15},fn:()=>{pay({arms:15});addRes('food',80)}},
    {label:'Send them on'}]}),
  ()=>({t:'Rot in the grain',p:'Mold has spread through part of the food stores.',o:[
    {label:'Burn the spoiled grain (lose 35% of your food)',fn:()=>{addRes('food',-S.res.food*0.35)}},
    {label:'Eat it anyway (−12 morale, someone may fall sick)',fn:()=>{S.morale-=12;if(Math.random()<0.5)kill(pickOne(S.v),'sick')}}]}),
  ()=>({t:'The people want a feast',p:'After another night of fighting, they ask for a proper meal together.',o:[
    {label:'Hold the feast (−40 food, +15 morale)',req:{food:40},fn:()=>{pay({food:40});S.morale+=15}},
    {label:'Not now (−4 morale)',fn:()=>{S.morale-=4}}]}),
  ()=>({t:'A wandering scholar',p:'An old scholar offers to copy what they know into your records, for supplies.',o:[
    {label:'Pay 40 wood and 20 stone (+30 lore)',req:{wood:40,stone:20},fn:()=>{pay({wood:40,stone:20});addRes('lore',30)}},
    {label:'Decline'}]}),
  ()=>({t:'A sellsword at the gate',p:'A hardened fighter offers their spear in exchange for equipment.',o:[
    {label:'Pay 15 arms (+1 spearman, if you have a free soldier post)',req:{arms:15},fn:()=>{pay({arms:15});const v=mkVillager(HCX,HCY+40);if(soldiers()<soldierCap()){v.job='spear';v.hp=maxHp(v)}log(`${v.name} the sellsword joins.`,'good')}},
    {label:'Decline'}]}),
];
function dawnEvent(){
  if(!S||modalOpen||S.phase!=='day')return;
  const ev=pickOne(EVENTS)();SFX.play('event');
  showModal(c=>{h(c,'div',`<span class="eyebrow">Morning of day ${S.day}</span>`);h(c,'h2',ev.t);h(c,'p',ev.p);
    addBtns(c,ev.o.map(o=>({label:o.label,disabled:o.req&&!afford(o.req),fn:()=>{o.fn&&o.fn();S.morale=clamp(S.morale,0,100)}})))});
}
function relicShop(c,rerender){
  h(c,'div',`<span class="sect">Relics</span> <span class="note">You hold ${meta.relics}. They carry over to every future settlement.</span>`);
  const box=document.createElement('div');box.style.cssText='display:flex;flex-direction:column;gap:6px';c.appendChild(box);
  for(const r of RELIC){const o=mkRow(box,r.name,()=>{const k=relicCost(r);if(meta.relics<k)return;meta.relics-=k;meta.up[r.k]++;saveMeta();rerender()});
    o.count.textContent=`level ${meta.up[r.k]}`;o.desc.textContent=r.desc;o.cost.innerHTML=`<span class="${meta.relics>=relicCost(r)?'':'short'}">${relicCost(r)} relics</span>`;o.btn.textContent='Buy';o.btn.disabled=meta.relics<relicCost(r)}
}
function intro(){
  const saved=loadRun();
  const render=()=>showModal(c=>{
    h(c,'h2','Hearthfield');
    h(c,'p','You are the steward of a small settlement on hostile land. You never pick up a sword. You give the orders and watch your people carry them out. Assign jobs, choose where every building goes, set rations and working hours, and decide how your soldiers fight. Each night raiders come from the directions your scouts report. When the hall falls, you earn relics that strengthen the next settlement.');
    h(c,'div','<div class="keys"><kbd>Drag</kbd><span>Move around the map. On a computer you can also use W A S D</span><kbd>Scroll / pinch</kbd><span>Zoom in and out</span><kbd>Click / tap</kbd><span>Select a villager or building to see what they are doing</span><kbd>Build tab</kbd><span>Pick a building, then place it on the map. Drag to draw walls</span><kbd>Space</kbd><span>Pause. You can still give orders while paused</span><kbd>1 2 3</kbd><span>Game speed</span><kbd>H</kbd><span>Jump back to the town hall</span></div>');
    h(c,'p','<span class="note">Workers carry goods to the nearest storage, so where you build matters. Woodcutters, quarriers and miners only reach resources inside their building\'s circle. Every fourth day is winter.</span>');
    if(meta.runs)h(c,'div',`<div class="stats"><span><b>${meta.best}</b>best nights</span><span><b>${meta.runs}</b>settlements lost</span></div>`);
    if(meta.relics>0||Object.values(meta.up).some(v=>v))relicShop(c,render);
    const opts=[];
    if(saved)opts.push({label:`Continue: day ${saved.day}, ${saved.nights} nights survived`,primary:true,fn:()=>{S=saved;Object.assign(S,{enemies:[],shots:[],parts:[],floats:[]});start()}});
    opts.push({label:saved?'Abandon it and found a new settlement':'Found the settlement',primary:!saved,fn:()=>{clearRun();newRun();saveRun();start()}});
    addBtns(c,opts);
  });
  render();
}
function start(){BIDX.clear();for(const b of S.b)BIDX.set(b.id,b);S.deer=S.deer||[];S.carc=S.carc||[];S.wx=S.wx||{rain:0,target:0,t:90};mapDirty=true;follow=null;mode=null;wallDrag=null;ghostSet=false;cam.x=HCX;cam.y=HCY+40;cam.z=touchMode?1.6:1.3;clampCam();if(!S.seed)S.seed=Math.floor(Math.random()*1e9);for(const k in groundCache)delete groundCache[k];wear.fill(0);PARTS.length=0;ANIMS.length=0;paused=false;speed=1;sel=null;mode=null;buildPanel();refresh()}
let over=false;
function gameOver(why){
  if(over)return;over=true;
  const n=S.nights,earned=Math.floor(n*(n+1)/4)+Math.floor(S.kills/50);
  meta.relics+=earned;meta.best=Math.max(meta.best,n);meta.runs++;saveMeta();clearRun();
  const kills=S.kills,day=S.day,pop=S.v.length;
  const render=()=>showModal(c=>{
    h(c,'div',`<span class="eyebrow">Day ${day}</span>`);h(c,'h2','The settlement is lost');h(c,'p',why);
    h(c,'div',`<div class="stats"><span><b>${n}</b>nights survived</span><span><b>${kills}</b>raiders slain</span><span><b>${pop}</b>survivors scattered</span><span><b>+${earned}</b>relics</span></div>`);
    relicShop(c,render);
    addBtns(c,[{label:'Found a new settlement',primary:true,fn:()=>{over=false;newRun();saveRun();start()}}]);
  });
  SFX.play('lose');setTimeout(render,50);
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
  const real=Math.min(0.05,(now-last)/1000);last=now;
  if(S&&!paused&&!modalOpen&&!over){for(let i=0;i<speed;i++)update(real)}
  if(S){panKeys(real);followCam(real)}
  draw(real);
  if(S){drawMini(real);SFX.tick(real,{night:S.phase==='night',winter:isWinter(),battle:S.enemies.length>0,L:lightLevel(),rain:isWinter()?0:(S.wx?S.wx.rain:0),paused:paused||modalOpen||over})}
  acc+=real;if(acc>0.25){acc=0;refresh()}
  requestAnimationFrame(frame);
}
function boot(data){
  resize();soundBtns();
  if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe($('#stage'));else window.addEventListener('resize',resize);
  let d=null;try{d=data&&data.S?JSON.parse(data.S):null}catch(e){}
  if(d&&d.map&&d.map.length===GW*GH){S=d;Object.assign(S,{enemies:[],shots:[],parts:[],floats:[]});start()}
  else intro();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>({S:S&&!over?ser(S):null}));
